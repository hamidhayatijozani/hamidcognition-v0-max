name: RFC-0003 Governance Tests

on:
  push:
    paths:
      - "governance/**"
      - "api/**"
      - "tests/**"
      - "main.py"
      - "core/**"
      - "config.py"
      - "requirements.txt"
      - ".github/workflows/rfc-0003.yml"
  pull_request:
    paths:
      - "governance/**"
      - "api/**"
      - "tests/**"
      - "main.py"
      - "core/**"
      - "config.py"
      - "requirements.txt"
      - ".github/workflows/rfc-0003.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile governance and API
        run: python -m compileall -q governance api core main.py
      - name: Run full test suite
        run: pytest tests/ -v
