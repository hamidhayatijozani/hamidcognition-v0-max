name: Lint & Format

on:
  push:
    branches: [ main, consolidation/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
    
    - name: Format check with black
      run: |
        black --check core governance tests
    
    - name: Import sorting check with isort
      run: |
        isort --check-only core governance tests
    
    - name: Lint with flake8
      run: |
        flake8 core governance tests --max-line-length=120 --ignore=E203,W503
    
    - name: Type check with mypy
      run: |
        mypy core governance --ignore-missing-imports || true